<!-- 게시글작성 -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>게시글 작성 | 포레스트 리솜</title>

    <style>

        /* =========================
           기본 설정
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
            color: #222;
            background: #fff;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }


        /* =========================
           상단 헤더
        ========================= */

        header {
            width: 100%;
            height: 80px;
            border-bottom: 1px solid #eee;
            background: #fff;
        }

        .header-inner {
            width: 1200px;
            height: 100%;
            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .logo span {
            color: #426d59;
        }

        nav {
            display: flex;
            gap: 35px;
            font-size: 14px;
            color: #444;
        }

        nav a:hover {
            color: #426d59;
        }


        /* =========================
           상단 배너
        ========================= */

        .sub-visual {
            width: 100%;
            height: 260px;

            background:
                linear-gradient(
                    rgba(0,0,0,0.25),
                    rgba(0,0,0,0.25)
                ),
                url("images/forest.jpg") center center / cover no-repeat;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sub-visual h1 {
            color: #fff;
            font-size: 42px;
            font-weight: 400;
            letter-spacing: -2px;
        }


        /* =========================
           경로
        ========================= */

        .breadcrumb {
            width: 1200px;
            margin: 25px auto 0;

            font-size: 13px;
            color: #999;
        }

        .breadcrumb span {
            margin: 0 8px;
            color: #ccc;
        }


        /* =========================
           게시판 영역
        ========================= */

        .board-wrap {
            width: 1200px;
            margin: 45px auto 100px;
        }

        .board-title {
            margin-bottom: 45px;
        }

        .board-title h2 {
            font-size: 38px;
            font-weight: 500;
            letter-spacing: -2px;
        }

        .board-title p {
            margin-top: 12px;
            color: #888;
            font-size: 14px;
        }


        /* =========================
           작성 폼
        ========================= */

        .write-form {
            width: 100%;
        }

        .form-group {
            margin-bottom: 30px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;

            font-size: 16px;
            font-weight: 500;
            color: #222;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;

            border: 1px solid #ddd;
            border-radius: 2px;

            background: #fff;

            font-size: 15px;
            color: #333;

            outline: none;
        }

        .form-group input {
            height: 48px;
            padding: 0 15px;
        }

        .form-group textarea {
            height: 350px;
            padding: 15px;

            resize: vertical;
            line-height: 1.7;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #aaa;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #777;
        }


        /* =========================
           파일 첨부
        ========================= */

        .file-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-box input[type="file"] {
            width: auto;
            border: none;
            padding: 0;
            height: auto;
        }

        .file-info {
            font-size: 13px;
            color: #999;
        }


        /* =========================
           버튼
        ========================= */

        .button-area {
            margin-top: 40px;

            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .button-area button {
            width: 90px;
            height: 42px;

            border: none;
            border-radius: 2px;

            font-size: 14px;
            cursor: pointer;
        }

        .btn-register {
            background: #426d59;
            color: #fff;
        }

        .btn-register:hover {
            background: #315544;
        }

        .btn-list {
            background: #777;
            color: #fff;
        }

        .btn-list:hover {
            background: #555;
        }


        /* =========================
           푸터
        ========================= */

        footer {
            border-top: 1px solid #eee;
            background: #fafafa;
            padding: 45px 0;
        }

        .footer-inner {
            width: 1200px;
            margin: 0 auto;

            color: #999;
            font-size: 12px;
            line-height: 2;
        }

        .footer-logo {
            color: #555;
            font-size: 18px;
            margin-bottom: 10px;
        }


        /* =========================
           모바일
        ========================= */

        @media screen and (max-width: 1240px) {

            .header-inner,
            .breadcrumb,
            .board-wrap,
            .footer-inner {
                width: calc(100% - 40px);
            }

        }


        @media screen and (max-width: 768px) {

            header {
                height: 65px;
            }

            .header-inner {
                width: calc(100% - 30px);
            }

            .logo {
                font-size: 20px;
            }

            nav {
                gap: 15px;
                font-size: 12px;
            }

            .sub-visual {
                height: 190px;
            }

            .sub-visual h1 {
                font-size: 32px;
            }

            .breadcrumb {
                width: calc(100% - 30px);
            }

            .board-wrap {
                width: calc(100% - 30px);
                margin-top: 35px;
            }

            .board-title {
                margin-bottom: 30px;
            }

            .board-title h2 {
                font-size: 30px;
            }

            .form-group {
                margin-bottom: 23px;
            }

            .form-group textarea {
                height: 280px;
            }

            .footer-inner {
                width: calc(100% - 30px);
            }

        }

    </style>
</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <div class="header-inner">

            <div class="logo">
                <span>FOREST</span> RESOM
            </div>

            <nav>
                <a href="#">포레스트</a>
                <a href="#">스파</a>
                <a href="#">객실</a>
                <a href="#">특별한 경험</a>
                <a href="#">부대시설</a>
                <a href="#">예약</a>
            </nav>

        </div>

    </header>


    <!-- =========================
         상단 배너
    ========================= -->

    <section class="sub-visual">

        <h1>NEWS</h1>

    </section>


    <!-- =========================
         경로
    ========================= -->

    <div class="breadcrumb">

        HOME
        <span>></span>
        포레스트
        <span>></span>
        뉴스
        <span>></span>
        게시글 작성

    </div>


    <!-- =========================
         게시글 작성
    ========================= -->

    <main class="board-wrap">


        <div class="board-title">

            <h2>게시글 작성</h2>

            <p>
                포레스트 리솜의 새로운 소식을 등록해주세요.
            </p>

        </div>


        <form class="write-form">


            <!-- 제목 -->

            <div class="form-group">

                <label for="title">
                    제목
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="제목을 입력해 주세요"
                >

            </div>


            <!-- 작성자 -->

            <div class="form-group">

                <label for="writer">
                    작성자
                </label>

                <input
                    type="text"
                    id="writer"
                    name="writer"
                    placeholder="이름을 입력해 주세요"
                >

            </div>


            <!-- TAG -->

            <div class="form-group">

                <label for="tag">
                    TAG
                </label>

                <input
                    type="text"
                    id="tag"
                    name="tag"
                    placeholder="태그를 입력해 주세요"
                >

            </div>


            <!-- 내용 -->

            <div class="form-group">

                <label for="content">
                    내용
                </label>

                <textarea
                    id="content"
                    name="content"
                    placeholder="내용을 입력해 주세요"
                ></textarea>

            </div>


            <!-- 첨부파일 -->

            <div class="form-group">

                <label for="file">
                    첨부파일
                </label>

                <div class="file-box">

                    <input
                        type="file"
                        id="file"
                        name="file"
                    >

                    <span class="file-info">
                        이미지 파일을 첨부할 수 있습니다.
                    </span>

                </div>

            </div>


            <!-- 버튼 -->

            <div class="button-area">

                <button
                    type="submit"
                    class="btn-register"
                >
                    등록
                </button>

                <button
                    type="button"
                    class="btn-list"
                    onclick="location.href='news_list.html'"
                >
                    목록
                </button>

            </div>


        </form>

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <div class="footer-inner">

            <div class="footer-logo">
                FOREST RESOM
            </div>

            충청북도 제천시 백운면 금봉로 365

            <br>

            대표번호 : 043-649-6000
            예약문의 : 1600-0060

            <br><br>

            COPYRIGHT © HOBAN HOTEL & RESORT.
            ALL RIGHTS RESERVED.

        </div>

    </footer>


</body>
</html>
