<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,th,td{border: 1px solid black; border-collapse:collapse ;}
        th,td{width: 80px; height: 40px;}
    </style>
</head>
<body>

    <input type="text" name="name" id="name" placeholder="이름입력">
    <br>
    <button type="button" onclick="saveBtn()">저장</button>
    <table>
        <tr>
            <th>이름</th>
        </tr>
        <tbody id="tbody">
            
        </tbody>
    </table>
    <script>
        var arr=['홍길동','유관순','이순신'];
        function saveBtn(){
            var nlist=document.getElementById("tbody");
            var name=document.getElementById("name").value;
            arr.push(name);
            document.getElementById("name").value="";
            console.log(arr);
            // alert("test")
            nlist.innerHTML=`<tr><td>${name}</td></tr>`+nlist.innerHTML;//이름을 추가하면 맨 위로
            nlist.innerHTML+=`<tr><td>${name}</td></tr>`;//이름을 추가하면 맨 아래로
        }


        var txtHtml=``;
        for(var i=0;i<arr.length;i++){
            txtHtml+=
            `<tr>
                <td>${arr[i]}</td>
            </tr>`;
        }
        document.getElementById("tbody").innerHTML=txtHtml;
