<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 부모요소 자식요소: 그 아래 자식요소 전부
            부모요소 > 자식요소: 자식요소만 
            부모요소 + 자식요소 :인접요소만*/

        input[type='text'] {background: yellow;} /*속성 선택자*/
        input:checked+label{color: red; font-weight: 700;}
        ul li{width: 120px; height: 60px; border: 1px solid black;}
        ul li:nth-of-type(4){background: yellow;} /*동일한 타입중 ()번째에 해당되는 것 - nth-child도 가능*/

    </style>
</head>
<body>
    <ul>
        <li>사과</li>
        <p>멍충이</p>
        <li>배</li>
        <li>복숭아</li>
        <li>수박</li>
    </ul>


    <input type="checkbox" name="hobby" id="game" value="게임">
    <label for="game">게임</label>
    <input type="checkbox" name="hobby" id="golf" value="골프">
    <label for="golf">골프</label>
    <input type="checkbox" name="hobby" id="swim" value="수영">
    <label for="swim">수영</label>
    <br>
    <button type="button" onclick="cheBtn()">확인</button>
    <script>
        function cheBtn(){
            // alert("확인")
            var count=document.querySelectorAll('input[name="hobby"]:checked').length;//속성 선택자
            alert("개수:"+count);
        }
    </script>
    <br>
    <hr>

    <input type="text"><br>
    <input type="password"><br>
    <input type="email"><br>
    <input type="search"><br>
</body>
</html>
