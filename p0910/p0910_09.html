<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입2</title>
    <style>
        #address{width: 400px;}
    </style>
    <script src="//t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script>
        function postbtn(){
        new kakao.Postcode({
            oncomplete: function(data) {
                console.log("우편번호:", data.zonecode);
                console.log("주소:", data.address);
                document.getElementById("zipcode").value= data.zonecode;
                document.getElementById("address").value= data.address;
            }
        }).open();}
    </script>
</head>
<body>
    <form name="frm" action="p0910_05.html" method="get">
        <label>아이디</label>
        <input type="text" id="id" name="id">
        <br>
        <label>패스워드</label>
        <input type="password" id="pw" name="pw">
        <br>
        <label>이름</label>
        <input type="text" id="name" name="name">
        <br><br>
            
        <label>주소</label>
        <br>
        <label>우편번호</label>
        <input type="text" id="zipcode" name="zipcode">
        <button type="button" onclick="postbtn()">우편번호 검색</button>
        <br>
        <label>상세주소</label>
        <input type="text" id="address" name="address">
        <br><br>

        <label>성별</label>
        <br>
        <input type="radio" id="man" name="gerder" value="남자">
        <label for="man">남자</label>
        <input type="radio" id="woman" name="gerder" value="여자">
        <label for="woman">여자</label>
        <br><br>
        <label>취미</label>
        <br>
        <input type="checkbox" id="game" name="hobby" value="게임">
        <label for="game">게임</label>
        <input type="checkbox" id="golf" name="hobby" value="골프">
        <label for="game">골프</label>
        <input type="checkbox" id="swim" name="hobby" value="수영">
        <label for="game">수영</label>
        <input type="checkbox" id="run" name="hobby" value="조깅">
        <label for="game">조깅</label>
        <input type="checkbox" id="book" name="hobby" value="독서">
        <label for="game">독서</label>

        <br>
        <input type="submit" value="전송">
    </form>
</body>
</html>
