<!-- position : relative / absolute / fixed-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0; padding: 0;}
        section{width: 800px; height: 800px; border: 1px solid black;
            margin: 50px auto; position: relative;}
        div{width: 100px; height: 100px;
            border: 3px solid black; box-sizing: border-box;}
        
        #i2{position: relative; left: 200px; top: 100px;} /* 현재 위치를 기준으로*/
        #i5{position: relative; left: 500px; top: -300px;}
        #i3{position: relative; right: 30px;}
        #i4{position: absolute; left: 400px; top: 0;}/*부모 요소를 기준으로: 부모 요소에 기준이 없으면 그 위 부모의 기준을 따름*/
    
    
    </style>
</head>
<body>
    <section> <!-- 부모요소 -->
        <div id="i1">1</div>
        <div id="i2">2</div>
        <div id="i3">3</div>
        <div id="i4">4</div>
        <div id="i5">5</div>
        <div id="i6">6</div>
        <div id="i7">7</div>
    </section>
</body>
</html>
