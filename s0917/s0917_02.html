<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 정보 받는건 form안 input에서만 받는데
        // 이것도 불안하여 csrt token->서버에서 토큰키를 발급해서 서버에서 보내준 form인지 확인
        var a=Number (prompt("숫자를 입력하세요"));
        if (a>0){
            document.write("양수");// documnent 전체=body부분에 쓴다
        }else if(a==0){
            document.write("0");
        }else document.write("음수"); //1줄일때는 {}를 없애서 쓰기도 한다
        
        // alert(a);
    </script>
    
</body>
</html>
