<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css" integrity="sha512-10/jx2EXwxxWqCLX/hHth/vu2KY3jCF70dCQB8TSgNjbCVAC/8vai53GfMDrO2Emgwccf2pJqxct9ehpzG+MTw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
    <style>
        
        *{margin:0; padding:0;}
        section{width:800px; height:3000px; border:1px solid black;
            margin:50px auto; position: relative;
            }
        div{width:100px; height:100px;
            border:3px solid black; box-sizing: border-box;
            }
            
            /* fixed는 브라우저 창 기준 */
        #i1{position: fixed; left:1400px; top:600px; 
            border-radius: 50%; text-align: center;
            font-size:30px; font-weight: 700; line-height: 90px;
            box-shadow: 0 0 10px 0 rgba(0,0,0,0.5);}
        #i1:hover{background: gray; color: white;}
            a{color: inherit; text-decoration: none;} /*클릭해도 색 변화 없이*/

        #i3{visibility: hidden;} /*자리를 유지한 채로 숨김*/
        #i5{display: none;}/* 공간도, 본인도 삭제*/

        #i4{position: relative; background: green; z-index: 10;}
        #i6{position: relative; top: -50px; background: yellow; z-index: 3;} 
        /*z-index값이 더 높은게 위로 올라옴. position이 있는 상태에서 가능*/

        /* #i1{position: relative; left: 700px;}
        #i2{position: relative; margin: 0 auto; top:200px;}
        #i3{position: relative; left: 250px;}
        #i4{position: absolute; left: 700px; top: 700px;}
        #i5{position: absolute; top: 700px;}
        #i6{position: absolute; right: 250px; top: 200px;} */
    </style>
</head>
<body>
    <section id="s1"> <!-- 부모요소 -->
        <a href="#s1"> <div id="i1"><i class="fa-solid fa-arrow-up"></i></div></a>
        <div id="i2">2</div>
        <div id="i3">3</div>
        <div id="i4">4</div>
        <div id="i5">5</div>
        <div id="i6">6</div>
        
    </section>
</body>
</html>
