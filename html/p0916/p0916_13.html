<!-- 회원가입 -->
<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>회원가입 | 리조트</title>

<style>
    /* =========================
    기본 초기화
    ========================= */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family:
            "Noto Sans KR",
            "Malgun Gothic",
            Arial,
            sans-serif;
        color: #333;
        background: #fff;
    }

    a {
        color: inherit;
        text-decoration: none;
    }

    button,
    input,
    select {
        font-family: inherit;
    }

    /* =========================
       헤더
    ========================= */
    header {
        width: 100%;
        height: 80px;
        border-bottom: 1px solid #eee;
        background: #fff;
    }

    .header-inner {
        width: 1200px;
        max-width: calc(100% - 40px);
        height: 80px;
        margin: 0 auto;

        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .logo {
        font-size: 27px;
        font-weight: 700;
        letter-spacing: -1px;
        color: #444;
    }

    .logo span {
        font-size: 13px;
        display: block;
        font-weight: 400;
        color: #999;
        margin-top: -2px;
    }

    .top-menu {
        display: flex;
        gap: 25px;
        font-size: 13px;
        color: #777;
    }

    .top-menu a:hover {
        color: #333;
    }

    /* =========================
       상단 배너
    ========================= */
    .sub-visual {
        width: 100%;
        height: 230px;

        background:
            linear-gradient(
                rgba(0, 0, 0, 0.25),
                rgba(0, 0, 0, 0.25)
            ),
            url("https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1800&q=80");

        background-size: cover;
        background-position: center;
        
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .visual-title {
        color: white;
        text-align: center;
    }

    .visual-title h1 {
        font-size: 34px;
        font-weight: 400;
        letter-spacing: -1px;
    }

    .visual-title p {
        margin-top: 12px;
        font-size: 14px;
        opacity: 0.9;
    }

    /* =========================
       전체 영역
    ========================= */
    .container {
        width: 900px;
        max-width: calc(100% - 40px);
        margin: 70px auto 100px;
    }

    /* =========================
       페이지 제목
    ========================= */
    .page-title {
        text-align: center;
        margin-bottom: 45px;
    }

    .page-title h2 {
        font-size: 30px;
        font-weight: 500;
        letter-spacing: -1px;
    }

    .page-title p {
        margin-top: 12px;
        font-size: 14px;
        color: #888;
    }

    /* =========================
       진행 단계
    ========================= */
    .step {
        display: flex;
        width: 100%;
        height: 70px;
        margin-bottom: 50px;
        border-top: 1px solid #ddd;
        border-bottom: 1px solid #ddd;
    }

    .step div {
        flex: 1;

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: 14px;
        color: #999;
        border-right: 1px solid #eee;
    }

    .step div:last-child {
        border-right: 0;
    }

    .step .active {
        color: #fff;
        background: #596b5b;
        font-weight: 500;
    }

    /* =========================
       회원가입 폼
    ========================= */
    .form-title {
        padding-bottom: 15px;
        border-bottom: 2px solid #333;

        font-size: 18px;
        font-weight: 500;
    }

    .form-table {
        width: 100%;
        border-collapse: collapse;
    }

    .form-table tr {
        border-bottom: 1px solid #eee;
    }

    .form-table th {
        width: 180px;
        padding: 18px 20px;

        background: #fafafa;
        text-align: left;

        font-size: 14px;
        font-weight: 500;
    }

    .form-table td {
        padding: 12px 15px;
        font-size: 14px;
    }

    .required {
        color: #d65b5b;
        margin-left: 3px;
    }

    /* =========================
       입력창
    ========================= */
    input,
    select {
        height: 42px;
        border: 1px solid #ddd;
        padding: 0 12px;

        font-size: 14px;
        outline: none;
        background: #fff;
    }

    input:focus,
    select:focus {
        border-color: #777;
    }

    .input-full {
        width: 100%;
        max-width: 500px;
    }

    .input-id {
        width: 330px;
    }

    .input-small {
        width: 130px;
    }

    .input-phone {
        width: 120px;
    }

    .input-email {
        width: 220px;
    }

    .dash {
        margin: 0 5px;
        color: #aaa;
    }

    /* =========================
       버튼
    ========================= */
    .check-btn {
        height: 42px;
        padding: 0 18px;
        margin-left: 5px;

        border: 1px solid #555;
        background: #fff;

        font-size: 13px;
        cursor: pointer;
    }

    .check-btn:hover {
        background: #555;
        color: white;
    }

    /* =========================
       약관
    ========================= */
    .agree-area {
        margin-top: 50px;
    }

    .agree-title {
        padding-bottom: 15px;
        border-bottom: 2px solid #333;

        font-size: 18px;
        font-weight: 500;
    }

    .agree-box {
        margin-top: 20px;
        padding: 20px;

        border: 1px solid #ddd;
        background: #fafafa;
    }

    .agree-box label {
        display: block;
        margin-bottom: 15px;
        font-size: 14px;
    }

    .agree-box label:last-child {
        margin-bottom: 0;
    }

    .agree-box input {
        width: 16px;
        height: 16px;
        margin-right: 8px;
        vertical-align: middle;
    }

    /* =========================
       가입 버튼
    ========================= */
    .button-area {
        margin-top: 45px;
        text-align: center;
    }

    .join-btn {
        width: 220px;
        height: 55px;

        border: 0;
        background: #596b5b;
        color: white;

        font-size: 16px;
        cursor: pointer;
    }

    .join-btn:hover {
        background: #465549;
    }

    .cancel-btn {
        width: 150px;
        height: 55px;
        margin-right: 8px;

        border: 1px solid #aaa;
        background: white;

        font-size: 16px;
        cursor: pointer;
    }

    /* =========================
       푸터
    ========================= */
    footer {
        padding: 40px 20px;

        background: #333;
        color: #aaa;

        text-align: center;
        font-size: 12px;
        line-height: 1.8;
    }

    /* =========================
       모바일
    ========================= */
    @media screen and (max-width: 700px) {

        header,
        .header-inner {
            height: 65px;
        }

        .header-inner {
            width: 100%;
        }

        .logo {
            font-size: 21px;
        }

        .top-menu {
            gap: 10px;
            font-size: 11px;
        }

        .sub-visual {
            height: 180px;
        }

        .visual-title h1 {
            font-size: 27px;
        }

        .container {
            margin-top: 45px;
        }

        .page-title h2 {
            font-size: 25px;
        }

        .step {
            height: 55px;
        }

        .step div {
            font-size: 12px;
        }

        .form-table th {
            width: 100px;
            padding: 14px 10px;
            font-size: 12px;
        }

        .form-table td {
            padding: 10px;
        }

        .input-full,
        .input-id {
            width: 100%;
        }

        .input-small,
        .input-phone,
        .input-email {
            width: 80px;
        }

        .check-btn {
            margin-top: 5px;
            margin-left: 0;
        }

        .cancel-btn {
            width: 100px;
        }

        .join-btn {
            width: 150px;
        }
    }
</style>


</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>


<div class="header-inner">

    <a href="#" class="logo">
        RESORT
        <span>HEALING &amp; NATURE</span>
    </a>

    <nav class="top-menu">
        <a href="#">로그인</a>
        <a href="#">회원가입</a>
        <a href="#">예약조회</a>
        <a href="#">고객센터</a>
    </nav>

</div>


</header>

<!-- =========================
     상단 이미지 영역
========================= -->

<section class="sub-visual">


<div class="visual-title">

    <h1>회원가입</h1>

    <p>
        리조트의 다양한 서비스를 이용해보세요.
    </p>

</div>


</section>

<!-- =========================
     회원가입
========================= -->

<main class="container">


<div class="page-title">

    <h2>회원가입</h2>

    <p>
        회원정보를 입력해 주세요.
    </p>

</div>


<!-- 가입 단계 -->
<div class="step">

    <div class="active">
        01. 약관동의
    </div>

    <div>
        02. 정보입력
    </div>

    <div>
        03. 가입완료
    </div>

</div>


<!-- 회원정보 -->
<section>

    <h3 class="form-title">
        기본정보
    </h3>


    <table class="form-table">

        <tr>
            <th>
                아이디
                <span class="required">*</span>
            </th>

            <td>

                <input
                    type="text"
                    class="input-id"
                    placeholder="아이디를 입력하세요"
                >

                <button
                    type="button"
                    class="check-btn"
                >
                    중복확인
                </button>

            </td>
        </tr>


        <tr>
            <th>
                비밀번호
                <span class="required">*</span>
            </th>

            <td>

                <input
                    type="password"
                    class="input-full"
                    placeholder="영문, 숫자 조합 8~20자"
                >

            </td>
        </tr>


        <tr>
            <th>
                비밀번호 확인
                <span class="required">*</span>
            </th>

            <td>

                <input
                    type="password"
                    class="input-full"
                    placeholder="비밀번호를 다시 입력하세요"
                >

            </td>
        </tr>


        <tr>
            <th>
                이름
                <span class="required">*</span>
            </th>

            <td>

                <input
                    type="text"
                    class="input-small"
                    placeholder="이름"
                >

            </td>
        </tr>


        <tr>
            <th>
                휴대전화
                <span class="required">*</span>
            </th>

            <td>

                <select class="input-phone">
                    <option>010</option>
                    <option>011</option>
                    <option>016</option>
                    <option>017</option>
                    <option>018</option>
                    <option>019</option>
                </select>

                <span class="dash">-</span>

                <input type="text" class="input-phone">

                <span class="dash">-</span>

                <input type="text" class="input-phone">

            </td>
        </tr>


        <tr>
            <th>
                이메일
                <span class="required">*</span>
            </th>

            <td>

                <input
                    type="email"
                    class="input-email"
                    placeholder="이메일"
                >

                <span class="dash">@</span>

                <select class="input-email">
                    <option>선택하세요</option>
                    <option>naver.com</option>
                    <option>gmail.com</option>
                    <option>daum.net</option>
                    <option>hanmail.net</option>
                </select>

            </td>
        </tr>


        <tr>
            <th>
                주소
            </th>

            <td>

                <input
                    type="text"
                    class="input-small"
                    placeholder="우편번호"
                >

                <button
                    type="button"
                    class="check-btn"
                >
                    우편번호 찾기
                </button>

                <br><br>

                <input
                    type="text"
                    class="input-full"
                    placeholder="기본주소"
                >

                <br><br>

                <input
                    type="text"
                    class="input-full"
                    placeholder="상세주소"
                >

            </td>
        </tr>

    </table>

</section>


<!-- 약관 -->
<section class="agree-area">

    <h3 class="agree-title">
        약관동의
    </h3>


    <div class="agree-box">

        <label>
            <input
                type="checkbox"
                id="allAgree"
            >
            <strong>전체 약관에 동의합니다.</strong>
        </label>

        <label>
            <input
                type="checkbox"
                class="agree"
            >
            이용약관에 동의합니다. (필수)
        </label>

        <label>
            <input
                type="checkbox"
                class="agree"
            >
            개인정보 수집 및 이용에 동의합니다. (필수)
        </label>

        <label>
            <input
                type="checkbox"
                class="agree"
            >
            마케팅 정보 수신에 동의합니다. (선택)
        </label>

    </div>

</section>


<!-- 버튼 -->
<div class="button-area">

    <button
        type="button"
        class="cancel-btn"
        onclick="history.back()"
    >
        취소
    </button>

    <button
        type="button"
        class="join-btn"
        onclick="joinMember()"
    >
        회원가입
    </button>

</div>


</main>

<!-- =========================
     FOOTER
========================= -->

<footer>


<p>
    RESORT &nbsp; | &nbsp;
    이용약관 &nbsp; | &nbsp;
    개인정보처리방침
</p>

<p>
    © 2026 RESORT. All Rights Reserved.
</p>


</footer>

<!-- =========================
     JAVASCRIPT
========================= -->

<script>

    // 전체동의
    const allAgree = document.getElementById("allAgree");

    const agreeList = document.querySelectorAll(".agree");


    allAgree.addEventListener("change", function() {

        agreeList.forEach(function(item) {

            item.checked = allAgree.checked;

        });

    });


    // 개별 약관 체크
    agreeList.forEach(function(item) {

        item.addEventListener("change", function() {

            const checkedCount =
                document.querySelectorAll(".agree:checked").length;

            if (checkedCount === agreeList.length) {

                allAgree.checked = true;

            } else {

                allAgree.checked = false;

            }

        });

    });


    // 회원가입
    function joinMember() {

        const requiredAgree =
            document.querySelectorAll(".agree")[0].checked;

        const privacyAgree =
            document.querySelectorAll(".agree")[1].checked;


        if (!requiredAgree || !privacyAgree) {

            alert(
                "필수 약관에 동의해 주세요."
            );

            return;

        }


        alert(
            "회원가입 페이지 예제입니다.\n\n" +
            "실제 회원가입 기능을 사용하려면\n" +
            "서버 및 DB 연결이 필요합니다."
        );

    }

</script>

</body>
</html>
