<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 무료 아이콘 사용가능 / 글자와 아이콘 사이즈가 같이 변함 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css" integrity="sha512-10/jx2EXwxxWqCLX/hHth/vu2KY3jCF70dCQB8TSgNjbCVAC/8vai53GfMDrO2Emgwccf2pJqxct9ehpzG+MTw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    
    <title>Document</title>
    <style>
        div{width: 500px; height: 200px; border: 1px solid black; /*테두리*/
        white-space: nowrap;
        letter-spacing: 5px; word-spacing: 20px;
        overflow: hidden; 
        text-overflow: ellipsis; /*...말줄임표*/
        font-size: 20px;
        margin-bottom: 20px; /*테두리의 바깥쪽*/
        padding-top: 50px;/*테두리 안쪽*/}

        div:hover{background: yellow; cursor: pointer;
        overflow: visible;
        width: 900px;}
        img{width: 20px;}
        span{font-size: 50px;}
        p{font-size: 50px;}
    </style>
</head>
<body>
    <div>111111111111111111111</div>
    <div>2222222222222222222222222</div>
    <div>3333333333333333333333333333</div>

    <img src="images/아이콘1.png"><span>아이콘</span>
    <hr>
    <p><i class="fa-solid fa-image"></i> 아이콘</p>
    <hr>

    <div>
        호르무즈 이어 홍해까지 장악되나···후티,홍해 연안의 주요 도시 모카 접수
    </div>
</body>
</html>
