<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,td,th{border:1px solid black;} /** 테이블 선 만들기**/
        table{border-collapse: collapse;} /** 선두께 없애기**/
        td{width:100px; height:40px;}

    </style>
</head>
<body>


    <table>
        <tr>
            <th>번호</th>
            <th>이름</th>
            <th>합계</th>
        </tr>
        <tr>
            <td>1</td>
            <td>홍길동</td>
            <td>100</td>
        </tr>
    </table>


    <hr>
<!-- table:표만들기 / tr:행(세로) / td:열(가로) -->
<!-- 시작점에서 colspan은 가로로 표 합치기  ,합치는 코드는 삭제처리-->
<!-- 시작점에서 rowspan은 세로로 표 합치기, 합치는 코드는 삭제처리 -->
    <table>
        <tr>
            <td>1행1열</td>
            <td>1행2열</td>
            <td>1행3열</td>
            <td>1행4열</td>            
        </tr>
        <tr>
            <td rowspan="2">2행1열</td>
            <td colspan="3">2행2열</td>
            <!-- <td>2행3열</td>
            <td>2행4열</td> -->
        </tr>
        <tr>
            <!-- <td>3행1열</td> -->
            <td>3행2열</td>
            <td>3행3열</td>
            <td>3행4열</td>
        </tr>
    </table>



    
</body>
</html>
