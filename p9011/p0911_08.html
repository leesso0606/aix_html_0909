<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{ border: 20px dotted black;
        width: 300px; height: 200px;
        background: yellowgreen;
        padding: 30px;}

        #d01{background-clip: border-box;}
        #d02{background-clip: padding-box;}
        #d03{background-clip: content-box;}
    </style>
</head>
<body>
    
    <div id="d01">111111111111</div>
    <div id="d02">11111111111</div>
    <div id="d03">111111111</div>
</body>
</html>
