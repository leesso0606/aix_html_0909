<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" name="n1" id="n1"><br>
    <input type="text" name="n2" id="n2"><br>
    <input type="text" name="n3" id="n3"><br>
    <button type="button" onclick="btn()">확인</button>
    <h2>결과</h2>
    <div id="d01"></div>
    <script>
        function btn(){
            //타입:str,int,float,boolean, definde,null
            // 변수선언 : var-옛버전, let-최신버전, const-상수
            //console.log  → 개발자에게 보여줌
            // document.write → 화면에 써줌
            // alert         → 알려줌
            // confirm       → 물어봄 (확인/취소)
            // prompt        → 입력받음

            //input-value . 나머지 -innerText
            // alert("확인")
            //n1과 n2를 비교하여 더 큰값을 출력하시오.
            var n1=Number(document.getElementById("n1").value);
            let n2=Number(document.getElementById("n2").value);
            const n3=Number(document.getElementById("n3").value);
            result=n1>n2?(n1>n3?n1:n3):(n2>n3?n2:n3);
            // result = result > n3 ? result : n3;
            document.getElementById("d01").innerText=result;
        }


    </script>
</body>
</html>
