<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="d01"></div>
    <div id="d02">몫</div>
    <div id="d03">나머지</div>
    <script>
        // 타입: str,int,float,boolean,null
        // 형변환:Number(),parseInt(),parseFloat(), toString()
        // 몫: parseInt(10/3)
        // 문자형+문자형=문자형/ 문자형+숫자형=문자형 처럼 다른 타입 합하는게 가능
        document.getElementById("d01").innerText=10/3
        document.getElementById("d02").innerText="몫:"+parseInt(10/3)
        document.getElementById("d03").innerText="나머지:"+10%3

        // 증감연산자: a=++b와 a=b++는 다름. b가 5일 때 a는 6,5


        // 출력하는 방법 console.log, document.write,alert,confirm,prompt
        var a=10;
        var b=3;
        var result= a>b?"a가 더 큽니다":"b가더 큽니다.";
        console.log("콘솔:"+result);

        document.write("화면에 출력됩니다"+result);

        alert(result);//경고창

        if(confirm("프로그램을 종료하시겠습니까?")){
            console.log("네")
        }else{
            console.log("아니오")
        }
        
        var num=prompt("값 입력")
        console.log("숫자:"+num)
    </script>
</body>
</html>
