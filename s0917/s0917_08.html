<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,th,td{border:1px solid black; border-collapse: collapse;}
        th,td{width:80px; height:40px; }
    </style>
</head>
<body>
    <!-- placeholder:빈 input칸 채우기용. 값을 작성하면 없어짐 -->
    <input type="text" name="name" id="name" placeholder="이름입력">
    <input type="text" name="kor" id="kor" placeholder="국어점수">
    <br>
    <button type="button" onclick="saveBtn()">저장</button>
    <table>
        <tr>
            <th>이름</th>
            <th>국어</th>
        </tr>
        <tbody id="tbody">
            <tr>
                <td></td>
                <td></td>
            </tr>
        </tbody>
    </table>

    <script>
        let arr1=['홍길동','유관순','이순신'];
        let arr2=[100,90,80];

        //값을 추가하여 화면에 출력할 때
        function saveBtn(){
            var nlist=document.getElementById("tbody");
            //input에 입력하는 값을 가져오기
            var name=document.getElementById("name").value;
            var kor=document.getElementById("kor").value;
            //위 변수의 값을 배열에 추가
            arr1.push(name);
            arr2.push(kor);
            //입력창 비우기
            document.getElementById("name").value="";
            document.getElementById("kor").value="";

            // 화면창 출력
            // 화면을 보여줄 html을 담을 빈 상자
            var txtHtml=``;

            // 배열의 데이터를 처음부터 끝까지 하나씩 꺼내서
            // HTML 한줄씩  txtHtml에 한줄씩 추가하기
            for(let i=0;i<arr1.length;i++){
            txtHtml+=`<tr><td>${arr1[i]}</td><td>${arr2[i]}</td></tr>`;     
            }

            //완성된 HTML을  변수 nlist의 id=tbody인 위치에 넣어서 화면에 출력
            nlist.innerHTML=txtHtml;
            // 또는 위 nlist가 없을 경우 ->한줄로 가능
            document.getElementById("tbody").innerHTML = txtHtml;
        }


        //배열에 있는 값을 출력만 할때
        let txtHtml=``;
        for(let i=0;i<arr1.length;i++){
            txtHtml+=`<tr><td>${arr1[i]}</td><td>${arr2[i]}</td></tr>`;     
        }
        document.getElementById("tbody").innerHTML=txtHtml




    </script>
</body>
</html>
