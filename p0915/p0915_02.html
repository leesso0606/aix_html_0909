<!-- float 블록요소를 인라인 요소로 바꿀수 있음. 하지만 요즘은 display:flex로 많이 함 -->
<!-- margin: 0 auto; 가운데로 정렬 -->
<!-- 글을 가운데로 정렬: text-align:center; -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0; padding: 0;}
        section{width: 700px; height: 100px; border: 1px solid black;
        margin: 0 auto;}
        div{width: 100px; height: 60px;}
        .d1{background: blue; float: left;} /* float:left를 하면 다음 것에 영향이 감. 안하고 싶으면 clear:both를 해야함*/
        .d2{background: yellow; float: left;}
        .d3{background: green; float: left;;}
        .d4{background: pink; float: right;}
        .d5{background: gray; float: right;}
        p{width: 100px; height: 100px; background: red;}
    </style>
</head>
<body>
    <!-- css:모양, 크기, 색상, 위치 / html: 내용, 뼈대 -->
    <section>
        <div class="d1">박스1</div>
        <div class="d2">박스2</div>
        <div class="d3">박스3</div>
        <div class="d4">박스4</div>
        <div class="d5">박스5</div>
        
    </section>
    <p>안녕하세요</p>
    
</body>
</html>
