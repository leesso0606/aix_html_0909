<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{width: 500px; height: 300px; color: blue;}
        /*원본에 transition에 조건을 넣어야 자연스럽게 진행-> 애니메이션 완성
        backface-visibility: hidden; /*뒤집어질때 사진을 숨김수 있다*/
        img{width: 300px; 
        /* transition: all 1s; */
        transition-property: height;
        transition-duration: 1s;
    }

        div:hover{ height: 400px;}

        /* transform: perspective->입체감을 줄수 있다.낮으수록 입체감이 큼
        .c2:hover{transform: rotateY(180deg);}
        .c3:hover{transform: perspective(100px) rotateY(180deg) ;} */


        /*  transform-origin ->기준점을 지정할 수 있음
        .c3:hover{transform: rotate(45deg); transform-origin: left bottom;} 
        .c1:hover{transform: skewX(45deg); transform-origin: left top;} */


        /* transform: skew ->기울기
        .c1:hover{transform: skewX(45deg);}
        .c2:hover{transform: skewY(45deg);}
        .c3:hover{transform: skew(45deg,45deg);} */


        /* transform: rotate-> 회전
        .c1:hover{transform: rotateX(45deg);}
        .c2:hover{transform: rotateY(45deg);}
        .c3:hover{transform: rotate(45deg);} */



        /* transform: scale-> 확대
        .c1:hover{transform: scaleX(1.5);}
        .c2:hover{transform: scaleY(1.5);}
        .c3:hover{transform: scale(1.5);} */


        /* transform: translate->이동
        .c1:hover{transform: translateX(100px);}
        .c2:hover{transform: translateY(100px);}
        .c3:hover{transform: translate(50px,50px);} */


    </style>
</head>
<body>

    <div></div>

    <!-- <div>
    <img class="c1" src="images/a2.jpg"><br><br>
    <img class="c2" src="images/a2.jpg"><br><br>
    <img class="c3" src="images/a2.jpg"><br><br> 
    </div> -->
</body>
</html>
