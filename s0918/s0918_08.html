<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script  src="http://code.jquery.com/jquery-latest.min.js"></script>
    <title>Document</title>
    <style>
        h2{text-align: center;}
        table,th,td{border: 1px solid black; border-collapse: collapse;}
        table{width: 1000px; text-align: center; box-sizing: border-box;
        margin: 50px auto;}
        th{background: #efefef; height: 60px;}
        td{height: 40px;}
    </style>

    <script>
        // 서버에서 가져오기
        var students=[
            {"no":1,"name":"홍길동","kor":100,"eng":100,"math":100,"total":300,"avg":100.0,"rank":0},
            {"no":2,"name":"유관순","kor":100,"eng":100,"math":100,"total":300,"avg":100.0,"rank":0}
        ];


        //제이쿼리 선언
        // $(function(){})은 쉽게 말하면 "HTML이 모두 만들어진 다음에 이 코드를 실행해줘."
        //$("요소명")->"#아이디명",".클래스명"...

        $(function(){
            // 제이쿼리 이벤트
            //수학입력창에 enter을 누르면 saveBtn()에 넣는 것 같이 저장된다.
            $("#math").on("keydown",function(e){
                if(e.key==="Enter"){
                    saveBtn();
                }
            });//math

            //name칸에 커서를 두는 순간 색이 변한다.
            //input칸에 커서를 두는 순간 자기자신이 색이 변한다
            $("input").on("focus",function(){
                $(this).css({"background":"yellow"})
            });
            //name칸에 커서를 빠져나가는 순간 색이 빠진다.
            //input칸에 커서를 빠져나가는 순간 자기자신이 색이 변한다
            $("input").on("blur",function(){
                $(this).css({"background":""})
            });//input

            // 동적함수이지만 정적함수형태로 진행
            // 문서 전체를 다시 읽는 동적함수
            // 다시 문서를 읽고 delete클래스를 클릭할 때 함수를 실행하라
            $(document).on("click",".delete",function(){
                if(confirm("학생성적을 삭제하시겠습니까?")){
                    // 현재위치점에서 가까운 tr의 id를 가져와라:인접관계
                    var delno=$(this).closest("tr").attr("id");
                    $("#"+delno).remove();
                }
            });//삭제버튼
        });
        
        
        
        //제이쿼리
        //value->val(), innerText->text(), innerHTML->html()

        /* $→ jQuery로 선택, ("#no")→ id가 no인 요소, .val()→ 그 요소의 value 값을 가져옴
        document.getElementById("no")와 같은 뜻*/

        //html():새롭게 추가
        //제이쿼리 append():기존 태그에 뒤에추가
        //prepend():기존 태그 앞에 추가


        function saveBtn(){
            // alert("test")
            var no=Number($("#no").val());
            var name=$("#name").val();
            var kor=Number($("#kor").val());
            var eng=Number($("#eng").val());
            var math=Number($("#math").val());
            var total=kor+eng+math;
            var avg=total/3;

            var txtHtml=`<tr id="${no}">
                <td>${no}</td>
                <td>${name}</td>
                <td>${kor}</td>
                <td>${eng}</td>
                <td>${math}</td>
                <td>${total}</td>
                <td>${avg}</td>
                <td>0</td>
                <td>
                    <button class="update">수정</button>
                    <button class="delete">삭제</button>
                    </td>
                </tr>`;

            //append,prepend,html
            $("#tbody").append(txtHtml);
            // $("#tbody").prepend(txtHtml);
            // $("#tbody").html(txtHtml);

            alert("학생성적을 저장합니다.")
            //데이터 초기화
            $("#no").val("");
            $("#name").val("");
            $("#kor").val("");
            $("#eng").val("");
            $("#math").val("");
            $("#no").focus();
            // json에 추가, 배열추가 push
            students.push(
                {"no":no,"name":name,"kor":kor,"eng":eng,"math":math,"total":total,"avg":avg,"rank":0}
            )

            console.log(no,name,kor,eng,math,total,avg)
        }
    </script>
</head>
<body>
    <h2>학생성적프로그램</h2>
    <input type="text" name="no" id="no" placeholder="번호입력"><br>
    <input type="text" name="name" id="name" placeholder="이름입력"><br>
    <input type="text" name="kor" id="kor" placeholder="국어점수입력"><br>
    <input type="text" name="eng" id="eng" placeholder="영어점수입력"><br>
    <input type="text" name="math" id="math" placeholder="수학점수입력"><br>
    <button type="button" onclick="saveBtn()">저장</button>
    <table>
        <colgroup><!-- 비율정하기-->
            <col width="10%">
            <col width="15%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="15%">
        </colgroup>

        <thead>
            <tr>
                <th>번호</th>
                <th>이름</th>
                <th>국어</th>
                <th>영어</th>
                <th>수학</th>
                <th>합계</th>
                <th>평균</th>
                <th>등수</th>
                <th>버튼</th>
            </tr>
        </thead>

        <tbody id="tbody">
        </tbody>
    </table>

    
    <script>
        // 배열추가:push,삭제:pop
        // 반복문 students배열
        var stu=``;
        for(var i=0;i<students.length;i++){
            stu+=`<tr id="${students[i].no}">
                <td>${students[i].no}</td>
                <td>${students[i].name}</td>
                <td>${students[i].kor}</td>
                <td>${students[i].eng}</td>
                <td>${students[i].math}</td>
                <td>${students[i].total}</td>
                <td>${students[i].avg}</td>
                <td>${students[i].rank}</td>
                <td>
                    <button class="update">수정</button>
                    <button class="delete">삭제</button>
                    </td>
                </tr>`;
        }

        // document.getElementById("tbody").innerHTML=stu; 아래와 같은 뜻
        $("#tbody").html(stu);
        
    </script>
</body>
</html>
